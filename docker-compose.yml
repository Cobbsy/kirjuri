# Local development environment: `docker compose up`, then open http://localhost:8080 and log in as
# admin with KIRJURI_ADMIN_PASSWORD. The source folder is mounted, so changes show up without rebuilding.
# Set KIRJURI_PORT to use another port than 8080.
services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: kirjuri-root
      MARIADB_DATABASE: kirjuri
      MARIADB_USER: kirjuri
      MARIADB_PASSWORD: kirjuri
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    ports:
      - "${KIRJURI_PORT:-8080}:80"
    environment:
      KIRJURI_DB_HOST: db
      KIRJURI_DB_NAME: kirjuri
      KIRJURI_DB_USER: kirjuri
      KIRJURI_DB_PASSWORD: kirjuri
      KIRJURI_ADMIN_PASSWORD: admin-password
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
