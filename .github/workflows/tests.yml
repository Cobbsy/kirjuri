name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install tools
        working-directory: tests
        run: composer install --no-interaction --no-progress

      - name: Run PHPStan
        working-directory: tests
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  test:
    name: PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest supported PHP, each on both databases.
        php: ['8.1', '8.4']
        database: ['mariadb:10.11', 'mysql:8.0']

    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot || mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, openssl, curl, zlib
          coverage: none

      - name: Install PHPUnit
        working-directory: tests
        run: composer install --no-interaction --no-progress

      - name: Run tests
        working-directory: tests
        env:
          KIRJURI_TEST_DB_HOST: 127.0.0.1
          KIRJURI_TEST_DB_USER: root
          KIRJURI_TEST_DB_PASSWORD: root
        run: vendor/bin/phpunit

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start
        run: docker compose up -d --build

      - name: Smoke test
        run: docker/smoke-test.sh http://localhost:8080 admin-password

      - name: Logs
        if: always()
        run: docker compose logs

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start
        run: docker compose up -d --build

      - name: Wait for the login page
        run: |
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/login.php)" = "200" ] && exit 0
            sleep 2
          done
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - name: Install Playwright
        working-directory: tests/browser
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: tests/browser
        env:
          KIRJURI_URL: http://localhost:8080/
          KIRJURI_ADMIN_PASSWORD: admin-password
        run: npx playwright test

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/browser/playwright-report
            tests/browser/test-results
          retention-days: 14

      - name: Logs
        if: always()
        run: docker compose logs
